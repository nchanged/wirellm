# =========================================================================
# WireLLM - Production Cluster Deployment Example
# Copy this file to a private location or pass via `helm install -f`
# =========================================================================

replicaCount: 1

image:
  repository: ghcr.io/your-org/wirellm
  tag: latest
  pullPolicy: Always

# Optional image pull secrets if using a private container registry:
# imagePullSecrets:
#   - name: my-registry-secret

service:
  type: ClusterIP
  port: 8765

# Traefik IngressRoute (or standard Kubernetes Ingress)
ingressroute:
  enabled: true
  entryPoints:
    - websecure
  host: llm.example.com
  tlsSecretName: llm-example-tls

# Automatic Let's Encrypt SSL/TLS Certificate via cert-manager
certificate:
  enabled: true
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer

# SQLite WAL database persistence
persistence:
  enabled: true
  mountPath: /data
  size: 5Gi
  # storageClass: "fast-storage"

# Cluster Security & Authentication Configuration
auth:
  # -----------------------------------------------------------------------
  # 1. API Token Access:
  #    Protects /v1/chat/completions, /v1/models, /v1/embeddings, /mcp/*
  #    Leave empty ([]) if you want open, unprotected API access.
  # -----------------------------------------------------------------------
  apiKeys:
    - "sk-wire-cluster-key-prod-001"
    - "sk-wire-agent-worker-002"

  # -----------------------------------------------------------------------
  # 2. Google OAuth:
  #    Protects the Web UI and Management APIs
  # -----------------------------------------------------------------------
  google:
    clientId: "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
    clientSecret: "GOCSPX-YOUR_GOOGLE_CLIENT_SECRET"
    allowedEmails:
      - "admin@example.com"
      - "*@yourcompany.com"

  # 3. Session Signing Secret
  sessionSecret: "generate-a-secure-random-string-here"

  # 4. Gateway Origin
  publicUrl: "https://llm.example.com"

  # Option B: Instead of putting keys in values, reference an existing K8s secret:
  # existingSecret: "wirellm-cluster-secrets"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

nodeSelector: {}
