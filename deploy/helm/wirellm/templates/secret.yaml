{{- if and (not .Values.auth.existingSecret) (or .Values.auth.apiKeys .Values.auth.google.clientId .Values.auth.google.clientSecret .Values.auth.sessionSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wirellm.secretName" . }}
  labels:
    {{- include "wirellm.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.auth.apiKeys }}
  API_KEYS: {{ join "," .Values.auth.apiKeys | b64enc | quote }}
  {{- end }}
  {{- if .Values.auth.google.clientId }}
  GOOGLE_CLIENT_ID: {{ .Values.auth.google.clientId | b64enc | quote }}
  {{- end }}
  {{- if .Values.auth.google.clientSecret }}
  GOOGLE_CLIENT_SECRET: {{ .Values.auth.google.clientSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.auth.sessionSecret }}
  AUTH_SESSION_SECRET: {{ .Values.auth.sessionSecret | b64enc | quote }}
  {{- end }}
{{- end }}
