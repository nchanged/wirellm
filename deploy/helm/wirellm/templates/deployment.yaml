apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wirellm.fullname" . }}
  labels:
    {{- include "wirellm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "wirellm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wirellm.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: wirellm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: WIRELLM_HOME
              value: {{ .Values.persistence.mountPath | quote }}
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.service.port | quote }}
            {{- if .Values.auth.publicUrl }}
            - name: WIRELLM_PUBLIC_URL
              value: {{ .Values.auth.publicUrl | quote }}
            {{- end }}
            {{- if .Values.auth.google.allowedEmails }}
            - name: WIRELLM_GOOGLE_ALLOWED_EMAILS
              value: {{ join "," .Values.auth.google.allowedEmails | quote }}
            {{- end }}
            {{- if or .Values.auth.existingSecret (or .Values.auth.apiKeys .Values.auth.google.clientId .Values.auth.google.clientSecret .Values.auth.sessionSecret) }}
            - name: WIRELLM_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "wirellm.secretName" . }}
                  key: API_KEYS
                  optional: true
            - name: WIRELLM_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "wirellm.secretName" . }}
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: WIRELLM_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "wirellm.secretName" . }}
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: WIRELLM_AUTH_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "wirellm.secretName" . }}
                  key: AUTH_SESSION_SECRET
                  optional: true
            {{- end }}
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "wirellm.fullname" . }}-data
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
